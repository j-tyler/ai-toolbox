<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="One eval run: four agent stages inside a Harbor container, each reading only what the driver hands it, then a Reward Kit verifier grading the workspace and the sealed artifacts.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1240" height="640" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, Helvetica, Arial" font-size="12" fill="#1f2937">

    <text x="24" y="30" font-size="16" font-weight="600">One run = one process version × one brief × one model</text>
    <text x="24" y="48" fill="#6b7280">Everything below happens inside one Harbor task container. Arrows say what each stage is allowed to read or write.</text>

    <!-- Workspace band -->
    <rect x="24" y="72" width="1192" height="150" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="36" y="92" font-weight="600">Workspace  /app  (git repo, the only place the agent sessions can write)</text>
    <!-- commit timeline -->
    <line x1="60" y1="190" x2="1180" y2="190" stroke="#1f2937" stroke-width="1.5"/>
    <g>
      <circle cx="100" cy="190" r="6" fill="#1f2937"/><text x="100" y="212" text-anchor="middle">seed</text>
      <circle cx="300" cy="190" r="6" fill="#1f2937"/><text x="300" y="212" text-anchor="middle">install process files</text>
      <text x="300" y="226" text-anchor="middle" fill="#6b7280">AGENTS.md block, intent dir</text>
      <circle cx="560" cy="190" r="6" fill="#2563eb"/><text x="560" y="212" text-anchor="middle" fill="#2563eb">eval: change intent</text>
      <circle cx="820" cy="190" r="6" fill="#1f2937"/><text x="820" y="212" text-anchor="middle">eval: implementation</text>
      <text x="820" y="226" text-anchor="middle" fill="#6b7280">HEAD is reset here after each review</text>
      <text x="1100" y="212" text-anchor="middle" fill="#6b7280">baseline..HEAD = diff.patch</text>
    </g>
    <text x="300" y="130" text-anchor="middle" fill="#6b7280">baseline commit</text>
    <line x1="300" y1="136" x2="300" y2="182" stroke="#9ca3af" stroke-dasharray="3 3"/>

    <!-- Stage boxes -->
    <g>
      <rect x="60" y="270" width="230" height="96" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="175" y="292" text-anchor="middle" font-weight="600">1  Author</text>
      <text x="175" y="310" text-anchor="middle">SDK session + authoring skill</text>
      <text x="175" y="326" text-anchor="middle" fill="#6b7280">custom instructions on</text>
      <text x="175" y="342" text-anchor="middle" fill="#2563eb">writes change-intent/*.md</text>
      <text x="175" y="358" text-anchor="middle" fill="#6b7280">only for author.mode = skill</text>

      <rect x="340" y="270" width="230" height="96" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
      <text x="455" y="292" text-anchor="middle" font-weight="600">2  Implement</text>
      <text x="455" y="310" text-anchor="middle">SDK session</text>
      <text x="455" y="326" text-anchor="middle" fill="#6b7280">+ implement.system_append</text>
      <text x="455" y="342" text-anchor="middle">prompt: "implement {source}"</text>
      <text x="455" y="358" text-anchor="middle" fill="#6b7280">source = intent path, or the brief</text>

      <rect x="620" y="270" width="230" height="96" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="735" y="292" text-anchor="middle" font-weight="600">3  Process review</text>
      <text x="735" y="310" text-anchor="middle">read-only session</text>
      <text x="735" y="326" text-anchor="middle" fill="#6b7280">+ review.system_append</text>
      <text x="735" y="342" text-anchor="middle">returns met / not met / cannot verify</text>
      <text x="735" y="358" text-anchor="middle" fill="#6b7280">only if the process defines review</text>

      <rect x="900" y="270" width="230" height="96" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
      <text x="1015" y="292" text-anchor="middle" font-weight="600">4  Fixed review</text>
      <text x="1015" y="310" text-anchor="middle">read-only, custom instructions OFF</text>
      <text x="1015" y="326" text-anchor="middle" fill="#6b7280">reviewer/fixed_reviewer.md, own model</text>
      <text x="1015" y="342" text-anchor="middle">returns JSON (schema-checked)</text>
      <text x="1015" y="358" text-anchor="middle" fill="#6b7280">identical for every condition</text>
    </g>
    <!-- stage order arrows -->
    <line x1="290" y1="318" x2="338" y2="318" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="570" y1="318" x2="618" y2="318" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="850" y1="318" x2="898" y2="318" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- stage <-> workspace arrows -->
    <line x1="175" y1="268" x2="175" y2="228" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="182" y="250" fill="#2563eb">commit intent</text>
    <line x1="455" y1="268" x2="455" y2="228" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="462" y="250">edit + commit code</text>
    <line x1="735" y1="268" x2="735" y2="228" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="742" y="250" fill="#6b7280">read only, then reset</text>
    <line x1="1015" y1="268" x2="1015" y2="228" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="1022" y="250" fill="#6b7280">read + run tests, then reset</text>

    <!-- Stand-in author -->
    <rect x="60" y="400" width="230" height="58" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="175" y="422" text-anchor="middle" font-weight="600">Stand-in author (harness)</text>
    <text x="175" y="440" text-anchor="middle" fill="#6b7280">same script for every condition</text>
    <line x1="175" y1="398" x2="175" y2="368" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="188" y="386">ask_user answers, end-of-turn replies</text>

    <!-- Sealed artifact dir -->
    <rect x="340" y="400" width="790" height="118" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="352" y="420" font-weight="600" fill="#ea580c">Sealed work dir (outside the workspace; copied to /app/.eval only at the very end)</text>
    <g fill="#1f2937">
      <rect x="352" y="432" width="200" height="72" rx="4" fill="#ffffff" stroke="#9ca3af"/>
      <text x="452" y="450" text-anchor="middle" font-weight="600">driver writes after stage 2</text>
      <text x="452" y="468" text-anchor="middle">diff.patch</text>
      <text x="452" y="484" text-anchor="middle">change_description.md</text>
      <text x="452" y="500" text-anchor="middle" fill="#6b7280">intent (if any) + implementer summary</text>

      <rect x="570" y="432" width="200" height="72" rx="4" fill="#ffffff" stroke="#9ca3af"/>
      <text x="670" y="450" text-anchor="middle" font-weight="600">review-input/</text>
      <text x="670" y="468" text-anchor="middle">copies of the two files above</text>
      <text x="670" y="484" text-anchor="middle" fill="#6b7280">the ONLY extra thing stage 4 sees</text>

      <rect x="788" y="432" width="330" height="72" rx="4" fill="#ffffff" stroke="#9ca3af"/>
      <text x="953" y="450" text-anchor="middle" font-weight="600">per-stage records</text>
      <text x="953" y="468" text-anchor="middle">summary.json  author_dialogue.json  process_review.md</text>
      <text x="953" y="484" text-anchor="middle">review.json  events-*.json  transcript-*.md</text>
      <text x="953" y="500" text-anchor="middle" fill="#6b7280">rendered_prompts.json, manifest hashes</text>
    </g>
    <path d="M 670 430 L 670 384 L 990 384 L 990 368" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="700" y="380" fill="#ea580c">stage 4 reads only this</text>

    <!-- Verifier -->
    <rect x="24" y="548" width="1192" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="36" y="568" font-weight="600" fill="#059669">5  Verifier  (Reward Kit, runs tests/test.sh after the agent exits; the agent never sees tests/)</text>
    <g>
      <text x="36" y="588" font-weight="600">correctness ×4</text><text x="140" y="588">hidden tests, regression, stdlib</text>
      <text x="360" y="588" font-weight="600">review ×2</text><text x="430" y="588">the fixed reviewer's JSON</text>
      <text x="610" y="588" font-weight="600">handoff ×1</text><text x="688" y="588">committed cleanly, no errors</text>
      <text x="905" y="588" font-weight="600">diagnostics ×0</text><text x="1000" y="588">intent, process review, tests added</text>
    </g>
    <text x="36" y="606" fill="#6b7280">reward.json + reward-details.json (every criterion's value)  →  scripts/analyze.py groups trials by the process named in summary.json</text>
    <line x1="620" y1="520" x2="620" y2="546" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
